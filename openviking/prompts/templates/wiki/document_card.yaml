metadata:
  id: "wiki.document_card"
  name: "Wiki Document Card"
  description: "Generate one Wiki Document Card from a resource document"
  version: "1.0.0"
  language: "en"
  category: "wiki"

variables:
  - name: "input_json"
    type: "string"
    description: "JSON encoded resource document"
    required: true

template: |
  Generate one Wiki Document Card for the given resource document.

  Use only content_or_structure as evidence.
  Return only the semantic card content: summary, important_terms, and candidate_topics.

  Input:
  {{ input_json }}

llm_config:
  temperature: 0.0
